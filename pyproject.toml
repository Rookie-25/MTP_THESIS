[project]
name = "xva-cuda-engine"
version = "0.1.0"
description = "GPU-native differentiable AAD Monte-Carlo XVA & Greeks engine"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Converting a graph-attached tensor to a Python scalar is always a mistake in
# this codebase (it silently keeps the autograd graph alive and warns on newer
# PyTorch builds). Promote it to a failure so it cannot accumulate unnoticed --
# older builds that stay silent are covered by the STRICT_TENSOR_SCALAR hook in
# tests/conftest.py instead.
markers = [
    # Live Yahoo/FRED requests. Skipped unless XVA_NETWORK_TESTS=1, because
    # they are neither deterministic nor available offline -- they exercise the
    # I/O wiring only, never numerical correctness.
    "network: hits live market data endpoints (opt-in)",
]
filterwarnings = [
    "error:Converting a tensor with requires_grad=True to a scalar:UserWarning",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
